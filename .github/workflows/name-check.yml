name: Basic name checks

on:
  pull_request:

jobs:
  branch-name:
    name: Validate Branch name
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check branch name
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|bugfix|hotfix|documentation|dependabot|release)/.+ ]]; then
            echo "❌ Branch '$BRANCH' doesn't match convention (feature/bugfix//...)"
            exit 1
          fi

  pr-name:
    name: Validate Pull Request's title
    runs-on: ubuntu-latest
    env:
      PR_NAME: ${{ github.event.pull_request.title }}
    steps:
      - name: Check Pull Request title
        run: |
          if [[ ! "$PR_NAME" =~ ^(feat|fix|chore|ci|test)(\(.*\))?!?:.+ ]]; then
            echo "❌ Pull request's title '$PR_NAME' doesn't match convention"
            exit 1
          fi
